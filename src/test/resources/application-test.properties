# Full context tests: no external MySQL; no scheduled HTTP calls to localhost.
spring.datasource.url=jdbc:h2:mem:iotmonitor_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

jwt.secret=test-secret-minimum-32-characters-long!!
jwt.expiration=86400000

spring.task.scheduling.enabled=false

spring.jackson.deserialization.accept-float-as-int=false

iot.r2.account-id=test-account-id
iot.r2.bucket=test-bucket
iot.r2.access-key-id=test-access-key
iot.r2.secret-access-key=test-secret-key
iot.r2.public-base-url=https://cdn.example.test
iot.r2.profile-picture-prefix=profile-pictures
