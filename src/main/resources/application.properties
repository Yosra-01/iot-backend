spring.application.name=iotmonitor
spring.profiles.active=dev

spring.config.import=optional:configtree:/run/secrets/

iot.simulation.base-url=http://localhost:8080

scheduler.traffic.cron=0 */1 * * * *
scheduler.airpollution.cron=0 */1 * * * *
scheduler.streetlight.cron=0 */1 * * * *

# Suppress Spring internal noise
logging.level.org.springframework.web.servlet.DispatcherServlet=WARN
logging.level.org.apache.catalina=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.scheduling=WARN

spring.jackson.time-zone=Africa/Cairo
spring.jackson.serialization.write-dates-as-timestamps=false
# Reject JSON floats (e.g. 5.5) when binding to Integer/Long fields
spring.jackson.deserialization.accept-float-as-int=false

# Profile picture upload size limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Profile pictures: stored only on disk as {userId}.{ext} (see ProfilePictureProperties).
iot.profile-pictures.directory=uploads/profile-pictures

jwt.secret=this_is_a_very_long_development_secret_key_for_jwt_tokens_12345
jwt.expiration=86400000