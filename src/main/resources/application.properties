spring.application.name=iotmonitor
spring.profiles.active=dev

spring.config.import=optional:configtree:/run/secrets/

iot.simulation.base-url=http://localhost:8080

scheduler.traffic.cron=0 */1 * * * *
scheduler.airpollution.cron=0 */1 * * * *
scheduler.streetlight.cron=0 */1 * * * *

# Suppress Spring internal noise
logging.level.org.springframework.web.servlet.DispatcherServlet=WARN
logging.level.org.apache.catalina=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.scheduling=WARN

spring.jackson.time-zone=Africa/Cairo
spring.jackson.serialization.write-dates-as-timestamps=false
# Reject JSON floats (e.g. 5.5) when binding to Integer/Long fields
spring.jackson.deserialization.accept-float-as-int=false

# Profile picture upload size limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Profile pictures are stored in Cloudflare R2 and exposed via a public bucket URL.
iot.r2.account-id=${IOT_R2_ACCOUNT_ID}
iot.r2.bucket=${IOT_R2_BUCKET}
iot.r2.access-key-id=${IOT_R2_ACCESS_KEY_ID}
iot.r2.secret-access-key=${IOT_R2_SECRET_ACCESS_KEY}
iot.r2.public-base-url=${IOT_R2_PUBLIC_BASE_URL}
iot.r2.profile-picture-prefix=${IOT_R2_PROFILE_PICTURE_PREFIX:profile-pictures}

jwt.secret=this_is_a_very_long_development_secret_key_for_jwt_tokens_12345
jwt.expiration=86400000
