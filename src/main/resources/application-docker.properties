# Used when SPRING_PROFILES_ACTIVE=docker (e.g. backend Dockerfile sets this).
# Pass credentials at runtime: docker run -e SPRING_DATASOURCE_URL=... -e JWT_SECRET=...
# Scheduler HTTP self-calls: inside the same container use http://localhost:8080 (default).
iot.simulation.base-url=${IOT_SIMULATION_BASE_URL:http://localhost:8080}

# Persist profile images across container restarts (compose mounts this path).
iot.profile-pictures.directory=${IOT_PROFILE_PICTURES_DIRECTORY:/var/lib/iotmonitor/profile-pictures}

spring.datasource.url=jdbc:mysql://localhost:3306/iot_db
spring.datasource.username=root
spring.datasource.password=iotmonitor_root_dev
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=5b07ca75f095e5751944826ec8c668f4
jwt.expiration=86400000

server.port=8080

# Match container TZ and local wall-clock for sensor timestamps (see docker-compose TZ).
spring.jackson.time-zone=Africa/Cairo
spring.jackson.serialization.write-dates-as-timestamps=false

spring.jackson.deserialization.accept-float-as-int=false

scheduler.traffic.cron: ${SCHEDULER_TRAFFIC_CRON:-0 */2 * * * *}
scheduler.airpollution.cron: ${SCHEDULER_AIRPOLLUTION_CRON:-0 */2 * * * *}
scheduler.streetlight.cron: ${SCHEDULER_STREETLIGHT_CRON:-0 */2 * * * *}

management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
