# Used when SPRING_PROFILES_ACTIVE=docker (e.g. backend Dockerfile sets this).
# Pass credentials at runtime: docker run -e SPRING_DATASOURCE_URL=... -e JWT_SECRET=...
# Scheduler HTTP self-calls: inside the same container use http://localhost:8080 (default).
iot.simulation.base-url=${IOT_SIMULATION_BASE_URL:http://localhost:8080}

# Persist profile images across container restarts (compose mounts this path).
iot.profile-pictures.directory=${IOT_PROFILE_PICTURES_DIRECTORY:/var/lib/iotmonitor/profile-pictures}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${db_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=${jwt_secret}
jwt.expiration=86400000

server.port=8080

spring.jackson.deserialization.accept-float-as-int=false

scheduler.traffic.cron=${TRAFFIC_CRON:0 */5 * * * *}
scheduler.airpollution.cron=${AIR_POLLUTION_CRON:0 */5 * * * *}
scheduler.streetlight.cron=${STREET_LIGHT_CRON:0 */5 * * * *}
