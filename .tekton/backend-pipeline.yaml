apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: backend-pipeline

spec:
  params:
    - name: repo-url
      type: string

    - name: revision
      type: string

    - name: deploy
      type: string
      default: "false"

    # Shared, non-secret SonarQube Cloud configuration.
    - name: sonar-organization
      type: string
      default: "dxcelerators"

    - name: sonar-project-key
      type: string
      default: "dxcelerators_iot-backend"

    # Leave empty for sonarcloud.io (EU). Use "us" for sonarqube.us.
    - name: sonar-region
      type: string
      default: ""

  workspaces:
    - name: source

    - name: basic-auth

    - name: dockerconfig
      optional: true

  tasks:
    # ---------------------------------------------------------
    # Clone the commit that triggered the run
    # ---------------------------------------------------------
    - name: fetch-repository
      taskRef:
        name: git-clone

      params:
        - name: url
          value: $(params.repo-url)

        - name: revision
          value: $(params.revision)

        # Preserve enough Git history for accurate Sonar SCM attribution.
        - name: depth
          value: "1000"

      workspaces:
        - name: output
          workspace: source

        - name: basic-auth
          workspace: basic-auth

    # ---------------------------------------------------------
    # Maven tests
    # ---------------------------------------------------------
    - name: test-backend
      runAfter:
        - fetch-repository

      taskSpec:
        workspaces:
          - name: source

        steps:
          - name: maven-test
            image: docker.io/library/maven:3.9.9-eclipse-temurin-21
            workingDir: $(workspaces.source.path)

            env:
              - name: HOME
                value: $(workspaces.source.path)

              - name: MAVEN_CONFIG
                value: $(workspaces.source.path)/.m2

            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              mvn -B clean \
                org.jacoco:jacoco-maven-plugin:0.8.15:prepare-agent \
                test \
                org.jacoco:jacoco-maven-plugin:0.8.15:report \
                -Dspring.profiles.active=test

              test -f target/site/jacoco/jacoco.xml
              echo "JaCoCo report: target/site/jacoco/jacoco.xml"

      workspaces:
        - name: source
          workspace: source

    # ---------------------------------------------------------
    # SonarQube Cloud analysis and Quality Gate
    # Free-plan setup: main/deploy pipeline only; PRs remain test-only.
    # ---------------------------------------------------------
    - name: sonar-analysis
      runAfter:
        - test-backend
      onError: continue
      when:
        - input: $(params.deploy)
          operator: in
          values:
            - "true"

      params:
        - name: organization
          value: $(params.sonar-organization)

        - name: project-key
          value: $(params.sonar-project-key)

        - name: region
          value: $(params.sonar-region)

        - name: revision
          value: $(params.revision)

      taskSpec:
        params:
          - name: organization
            type: string

          - name: project-key
            type: string

          - name: region
            type: string

          - name: revision
            type: string

        workspaces:
          - name: source

        steps:
          - name: analyze-and-check-gate
            image: docker.io/library/maven:3.9.9-eclipse-temurin-21
            workingDir: $(workspaces.source.path)

            env:
              - name: HOME
                value: /tmp

              - name: MAVEN_CONFIG
                value: $(workspaces.source.path)/.m2

              # Keep scanner/JRE downloads off the 1 Gi shared PVC.
              - name: SONAR_USER_HOME
                value: /tmp/.sonar

              - name: SONAR_SCANNER_JAVA_OPTS
                value: -Xmx512m

              - name: SONAR_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: sonarcloud-credentials
                    key: SONAR_TOKEN

            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              REPORT_PATH="target/site/jacoco/jacoco.xml"

              if [ ! -f "$REPORT_PATH" ]; then
                echo "JaCoCo XML report was not generated: $REPORT_PATH"
                exit 1
              fi

              REGION_ARGUMENT=()

              if [ -n "$(params.region)" ]; then
                REGION_ARGUMENT+=("-Dsonar.region=$(params.region)")
              fi

              cleanup() {
                rm -rf "${SONAR_USER_HOME}" || true
                rm -rf "${MAVEN_CONFIG}" || true
              }
              trap cleanup EXIT

              echo "Using coverage report: $REPORT_PATH"

              mvn -B \
                "-Dmaven.repo.local=$(workspaces.source.path)/.m2/repository" \
                org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar \
                "-Dsonar.host.url=https://sonarcloud.io" \
                "-Dsonar.organization=$(params.organization)" \
                "-Dsonar.projectKey=$(params.project-key)" \
                "-Dsonar.scm.revision=$(params.revision)" \
                "-Dsonar.sourceEncoding=UTF-8" \
                "-Dsonar.coverage.jacoco.xmlReportPaths=${REPORT_PATH}" \
                "-Dsonar.qualitygate.wait=true" \
                "-Dsonar.qualitygate.timeout=300" \
                "${REGION_ARGUMENT[@]}"

      workspaces:
        - name: source
          workspace: source

    # ---------------------------------------------------------
    # Calculate next version:
    # 4.1 -> 4.2 -> ... -> 4.9 -> 5.0
    # ---------------------------------------------------------
    - name: calculate-version
      runAfter:
        - sonar-analysis

      when:
        - input: $(params.deploy)
          operator: in
          values:
            - "true"

      params:
        - name: revision
          value: $(params.revision)

      taskSpec:
        params:
          - name: revision
            type: string

        results:
          - name: immutable-image
            type: string

          - name: version-image
            type: string

          - name: commit-image
            type: string

          - name: latest-image
            type: string

          - name: next-version
            type: string

        steps:
          - name: generate-tags
            image: quay.io/openshift/origin-cli:latest

            env:
              - name: HOME
                value: /tmp

            script: |
              #!/bin/sh
              set -eu

              CURRENT_IMAGE="$(oc get deployment/backend \
                -o jsonpath='{.spec.template.spec.containers[?(@.name=="backend")].image}')"

              CURRENT_TAG="${CURRENT_IMAGE##*:}"
              CURRENT_VERSION="${CURRENT_TAG%%-*}"
              CURRENT_VERSION="${CURRENT_VERSION#v}"

              if ! printf '%s' "$CURRENT_VERSION" |
                grep -Eq '^[0-9]+\.[0-9]$'; then
                echo "Cannot determine version from: $CURRENT_IMAGE"
                echo "Expected a tag such as 4.1 or 4.1-abcdef1"
                exit 1
              fi

              MAJOR="${CURRENT_VERSION%%.*}"
              MINOR="${CURRENT_VERSION##*.}"

              if [ "$MINOR" -eq 9 ]; then
                NEXT_VERSION="$((MAJOR + 1)).0"
              else
                NEXT_VERSION="${MAJOR}.$((MINOR + 1))"
              fi

              SHORT_SHA="$(printf '%s' "$(params.revision)" | cut -c1-7)"
              BASE_IMAGE="docker.io/aliyehia/iot-backend"

              IMMUTABLE_IMAGE="${BASE_IMAGE}:${NEXT_VERSION}-${SHORT_SHA}"
              VERSION_IMAGE="${BASE_IMAGE}:${NEXT_VERSION}"
              COMMIT_IMAGE="${BASE_IMAGE}:sha-${SHORT_SHA}"
              LATEST_IMAGE="${BASE_IMAGE}:latest"

              printf '%s' "$IMMUTABLE_IMAGE" \
                > "$(results.immutable-image.path)"

              printf '%s' "$VERSION_IMAGE" \
                > "$(results.version-image.path)"

              printf '%s' "$COMMIT_IMAGE" \
                > "$(results.commit-image.path)"

              printf '%s' "$LATEST_IMAGE" \
                > "$(results.latest-image.path)"

              printf '%s' "$NEXT_VERSION" \
                > "$(results.next-version.path)"

              echo "Current image:   $CURRENT_IMAGE"
              echo "Next version:    $NEXT_VERSION"
              echo "Immutable image: $IMMUTABLE_IMAGE"
              echo "Version image:   $VERSION_IMAGE"
              echo "Commit image:    $COMMIT_IMAGE"

    # ---------------------------------------------------------
    # Build once and push immutable image
    # ---------------------------------------------------------
    - name: build-and-push
      runAfter:
        - calculate-version

      when:
        - input: $(params.deploy)
          operator: in
          values:
            - "true"

      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task

          - name: name
            value: buildah

          - name: namespace
            value: openshift-pipelines

      params:
        - name: IMAGE
          value: $(tasks.calculate-version.results.immutable-image)

        - name: DOCKERFILE
          value: ./Dockerfile

        - name: CONTEXT
          value: .

        - name: TLS_VERIFY
          value: "true"

      workspaces:
        - name: source
          workspace: source

        - name: dockerconfig
          workspace: dockerconfig

    # ---------------------------------------------------------
    # Deploy the candidate image internally for pre-live checks
    # ---------------------------------------------------------
    - name: deploy-smoke-backend
      runAfter:
        - build-and-push

      when:
        - input: $(params.deploy)
          operator: in
          values:
            - "true"

      params:
        - name: image
          value: $(tasks.calculate-version.results.immutable-image)

      taskSpec:
        params:
          - name: image
            type: string

        steps:
          - name: deploy-smoke
            image: quay.io/openshift/origin-cli:latest

            env:
              - name: HOME
                value: /tmp

            script: |
              #!/bin/sh
              set -eu

              echo "Deploying candidate image to internal smoke environment:"
              echo "$(params.image)"

              oc apply -f - <<EOF
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: backend-smoke
                labels:
                  app: backend-smoke
              spec:
                replicas: 1
                strategy:
                  type: Recreate
                selector:
                  matchLabels:
                    app: backend-smoke
                template:
                  metadata:
                    labels:
                      app: backend-smoke
                  spec:
                    containers:
                      - name: backend
                        image: $(params.image)
                        ports:
                          - containerPort: 8080
                        env:
                          - name: SPRING_PROFILES_ACTIVE
                            value: "docker"
                          - name: SPRING_DATASOURCE_URL
                            value: "jdbc:mysql://db:3306/iot_db"
                          - name: SPRING_DATASOURCE_USERNAME
                            value: "root"
                          - name: SCHEDULER_TRAFFIC_CRON
                            value: "0 0 0 1 1 *"
                          - name: SCHEDULER_AIRPOLLUTION_CRON
                            value: "0 0 0 1 1 *"
                          - name: SCHEDULER_STREETLIGHT_CRON
                            value: "0 0 0 1 1 *"
                          - name: db_password
                            valueFrom:
                              secretKeyRef:
                                name: sensorix-secrets
                                key: db-password
                          - name: jwt_secret
                            valueFrom:
                              secretKeyRef:
                                name: sensorix-secrets
                                key: jwt-secret
                        readinessProbe:
                          httpGet:
                            path: /actuator/health/readiness
                            port: 8080
                          initialDelaySeconds: 20
                          periodSeconds: 10
                        livenessProbe:
                          httpGet:
                            path: /actuator/health/liveness
                            port: 8080
                          initialDelaySeconds: 30
                          periodSeconds: 15
              ---
              apiVersion: v1
              kind: Service
              metadata:
                name: backend-smoke
                labels:
                  app: backend-smoke
              spec:
                type: ClusterIP
                selector:
                  app: backend-smoke
                ports:
                  - port: 8080
                    targetPort: 8080
              EOF

              if ! oc rollout status deployment/backend-smoke --timeout=300s; then
                echo "Smoke deployment failed."
                oc get pods -l app=backend-smoke -o wide || true

                POD_NAME="$(oc get pods -l app=backend-smoke \
                  -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"

                if [ -n "$POD_NAME" ]; then
                  oc logs "$POD_NAME" --tail=200 || true
                  oc describe pod "$POD_NAME" || true
                fi

                exit 1
              fi

              echo "Smoke backend is ready."
              oc get deployment backend-smoke
              oc get service backend-smoke

    # ---------------------------------------------------------
    # Run sanity checks against the candidate before live deploy
    # ---------------------------------------------------------
    - name: backend-sanity-checks
      runAfter:
        - deploy-smoke-backend

      when:
        - input: $(params.deploy)
          operator: in
          values:
            - "true"

      taskSpec:
        workspaces:
          - name: source

        steps:
          - name: run-newman
            image: docker.io/postman/newman:alpine
            workingDir: $(workspaces.source.path)

            env:
              - name: HOME
                value: /tmp

            script: |
              #!/bin/sh
              set -eu

              COLLECTION="postman/Sensorix_SanityChecks.json"
              BASE_URL="http://backend-smoke:8080"

              echo "Working directory:"
              pwd

              echo "Postman files:"
              find postman -maxdepth 2 -type f -print || true

              if [ ! -f "$COLLECTION" ]; then
                echo "ERROR: Collection not found: $COLLECTION"
                exit 1
              fi

              mkdir -p newman-results

              echo "Running Newman against $BASE_URL"

              newman run "$COLLECTION" \
                --env-var "base_url=$BASE_URL" \
                --reporters cli,junit \
                --reporter-junit-export newman-results/backend-sanity.xml \
                --color off \
                --verbose

      workspaces:
        - name: source
          workspace: source

    # ---------------------------------------------------------
    # Add version, commit and latest aliases
    # ---------------------------------------------------------
    - name: publish-additional-tags
      runAfter:
        - backend-sanity-checks

      when:
        - input: $(params.deploy)
          operator: in
          values:
            - "true"

      params:
        - name: immutable-image
          value: $(tasks.calculate-version.results.immutable-image)

        - name: version-image
          value: $(tasks.calculate-version.results.version-image)

        - name: commit-image
          value: $(tasks.calculate-version.results.commit-image)

        - name: latest-image
          value: $(tasks.calculate-version.results.latest-image)

      taskSpec:
        params:
          - name: immutable-image
            type: string

          - name: version-image
            type: string

          - name: commit-image
            type: string

          - name: latest-image
            type: string

        workspaces:
          - name: dockerconfig
            optional: true

        steps:
          - name: copy-tags
            image: quay.io/skopeo/stable:latest

            env:
              - name: HOME
                value: /tmp

            script: |
              #!/bin/sh
              set -eu

              AUTH_DIRECTORY="$(workspaces.dockerconfig.path)"

              if [ -f "$AUTH_DIRECTORY/.dockerconfigjson" ]; then
                AUTH_FILE="$AUTH_DIRECTORY/.dockerconfigjson"
              elif [ -f "$AUTH_DIRECTORY/config.json" ]; then
                AUTH_FILE="$AUTH_DIRECTORY/config.json"
              else
                echo "Docker authentication file was not found."
                exit 1
              fi

              skopeo copy \
                --authfile "$AUTH_FILE" \
                "docker://$(params.immutable-image)" \
                "docker://$(params.version-image)"

              skopeo copy \
                --authfile "$AUTH_FILE" \
                "docker://$(params.immutable-image)" \
                "docker://$(params.commit-image)"

              skopeo copy \
                --authfile "$AUTH_FILE" \
                "docker://$(params.immutable-image)" \
                "docker://$(params.latest-image)"

      workspaces:
        - name: dockerconfig
          workspace: dockerconfig

    # ---------------------------------------------------------
    # Deploy immutable image and roll back if rollout fails
    # ---------------------------------------------------------
    - name: deploy-backend
      runAfter:
        - publish-additional-tags

      when:
        - input: $(params.deploy)
          operator: in
          values:
            - "true"

      params:
        - name: image
          value: $(tasks.calculate-version.results.immutable-image)

        - name: version
          value: $(tasks.calculate-version.results.next-version)

      taskSpec:
        params:
          - name: image
            type: string

          - name: version
            type: string

        steps:
          - name: deploy
            image: quay.io/openshift/origin-cli:latest

            env:
              - name: HOME
                value: /tmp

            script: |
              #!/bin/sh
              set -eu

              OLD_IMAGE="$(oc get deployment/backend \
                -o jsonpath='{.spec.template.spec.containers[?(@.name=="backend")].image}')"

              NEW_IMAGE="$(params.image)"

              echo "Deploying backend $(params.version)"
              echo "Old image: $OLD_IMAGE"
              echo "New image: $NEW_IMAGE"

              R2_SECRET_NAME="sensorix-secrets"
              REQUIRED_R2_SECRET_KEYS="
              r2-account-id
              r2-bucket
              r2-access-key-id
              r2-secret-access-key
              r2-public-base-url
              "

              if ! oc get secret "$R2_SECRET_NAME" >/dev/null 2>&1; then
                echo "ERROR: Missing R2 secret: ${R2_SECRET_NAME}"
                exit 1
              fi

              for key in $REQUIRED_R2_SECRET_KEYS; do
                if [ -z "$(oc get secret "$R2_SECRET_NAME" -o "jsonpath={.data['$key']}" 2>/dev/null)" ]; then
                  echo "ERROR: Missing R2 secret key: ${key}"
                  exit 1
                fi
              done

              oc patch deployment/backend --type=strategic -p "$(cat <<'EOF'
              spec:
                template:
                  spec:
                    containers:
                      - name: backend
                        env:
                          - name: IOT_R2_ACCOUNT_ID
                            valueFrom:
                              secretKeyRef:
                                name: sensorix-secrets
                                key: r2-account-id
                          - name: IOT_R2_BUCKET
                            valueFrom:
                              secretKeyRef:
                                name: sensorix-secrets
                                key: r2-bucket
                          - name: IOT_R2_ACCESS_KEY_ID
                            valueFrom:
                              secretKeyRef:
                                name: sensorix-secrets
                                key: r2-access-key-id
                          - name: IOT_R2_SECRET_ACCESS_KEY
                            valueFrom:
                              secretKeyRef:
                                name: sensorix-secrets
                                key: r2-secret-access-key
                          - name: IOT_R2_PUBLIC_BASE_URL
                            valueFrom:
                              secretKeyRef:
                                name: sensorix-secrets
                                key: r2-public-base-url
              EOF
              )"

              oc set image deployment/backend \
                backend="$NEW_IMAGE"

              oc scale deployment/backend --replicas=1

              if ! oc rollout status deployment/backend --timeout=300s; then
                echo "Rollout failed. Restoring $OLD_IMAGE"

                oc set image deployment/backend \
                  backend="$OLD_IMAGE" || true

                oc scale deployment/backend --replicas=1 || true

                oc rollout status deployment/backend \
                  --timeout=300s || true

                exit 1
              fi

              DEPLOYED_IMAGE="$(oc get deployment/backend \
                -o jsonpath='{.spec.template.spec.containers[?(@.name=="backend")].image}')"

              if [ "$DEPLOYED_IMAGE" != "$NEW_IMAGE" ]; then
                echo "Deployment image verification failed."
                echo "Expected: $NEW_IMAGE"
                echo "Actual:   $DEPLOYED_IMAGE"
                exit 1
              fi

              echo "Backend deployment succeeded."
              oc get deployment backend
              oc get pods -l app=backend

  finally:
    # Always remove the temporary candidate deployment and service.
    - name: cleanup-smoke-backend
      when:
        - input: $(params.deploy)
          operator: in
          values:
            - "true"

      taskSpec:
        steps:
          - name: cleanup
            image: quay.io/openshift/origin-cli:latest

            env:
              - name: HOME
                value: /tmp

            script: |
              #!/bin/sh
              set -eu

              oc delete deployment/backend-smoke \
                service/backend-smoke \
                --ignore-not-found=true \
                --wait=false

              echo "Smoke environment cleanup requested."
